name: Release

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - name: Use Node.js 24.x
              uses: actions/setup-node@v4
              with:
                  node-version: 24.x
                  cache: "pnpm"

            - name: Check the tag, the manifest and the changelog agree
              run: node tools/changelog.mjs check "$GITHUB_REF_NAME"

            - name: Write the release notes from the changelog
              run: node tools/changelog.mjs notes "$GITHUB_REF_NAME" release-notes.md

            - run: pnpm install --frozen-lockfile

            - run: pnpm --filter mdsync run build

            - name: Attest the build
              uses: actions/attest@v4
              with:
                  subject-path: |
                      manifest.json
                      packages/plugin/main.js
                      packages/plugin/styles.css

            - name: Create release
              uses: softprops/action-gh-release@v2
              with:
                  body_path: release-notes.md
                  fail_on_unmatched_files: true
                  files: |
                      manifest.json
                      packages/plugin/main.js
                      packages/plugin/styles.css
